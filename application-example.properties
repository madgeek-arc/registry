# Example configuration for registry-service (or a host embedding registry-starter-service).
# Copy outside the repository, fill the placeholders and pass it with
#   --spring.config.additional-location=file:./application.properties
# Never commit real credentials.

server.port=8080
# Public base URL for ResourceSync documents. Without it, the request URL is used.
registry.host=https://<public-registry-host>

# PostgreSQL with pgvector and tablefunc (the extensions and schema are created by Flyway)
registry.datasource.url=jdbc:postgresql://<db-host>:5432/<registry-db>
registry.datasource.username=<db-user>
registry.datasource.password=<db-password>
registry.datasource.configuration.maximum-pool-size=10
spring.flyway.enabled=true

# REST controllers. They have no authentication: the application must guard their paths
# (/records, /resources, /resourceType, /search, /version, /schemaService, /dump, /restore, /resourcesync),
# or set this to false when the registry is only used in-process.
registry.rest.enabled=true

# Resource types loaded at startup
registry.resource-type-init.location=classpath*:resourceTypes

# Elasticsearch (set enabled=false to use PostgreSQL search only)
registry.elasticsearch.enabled=true
registry.elasticsearch.uris=https://<elastic-node-1>:9200,https://<elastic-node-2>:9200
registry.elasticsearch.username=<elastic-user>
registry.elasticsearch.password=<elastic-password>

# JMS (set enabled=false to disable change events)
registry.jms.enabled=true
registry.jms.host=tcp://<activemq-host>:61616
registry.jms.prefix=registry
registry.jms.username=<jms-user>
registry.jms.password=<jms-password>

batch.chunkSize=10

# Client side (application using registry-starter-client):
# registry.base=http://<registry-host>:8080
# registry.client.connect-timeout=10s
# registry.client.read-timeout=60s
